name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 0. Set up the environment
      - name: Install system dependencies setup-r does not
        run: |
          # GitHub-hosted Ubuntu runners can intermittently stall on the
          # Azure-local Ubuntu mirror. Prefer the main Ubuntu archive instead.
          for sources_file in \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$sources_file" ]; then
              sudo sed -i -E \
                's#https?://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' \
                "$sources_file"
            fi
          done

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update -y

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install --no-install-recommends -y \
              libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev \
              libgit2-dev libjpeg-dev libpng-dev libx11-dev pandoc

      # 1. Get the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up R
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::devtools
            any::decor
          needs: check
          # Save only a successfully completed package library. Cache version 4
          # starts a clean binary-backed cache using Posit Public Package Manager.
          # Runs on master warm a cache that Copilot task branches can subsequently restore.
          cache: true
          cache-version: '4'

      - name: Verify R development environment
        run: |
          Rscript -e 'stopifnot(requireNamespace("devtools", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("testthat", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("flowCore", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("flowWorkspace", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("decor", quietly = TRUE))'
          Rscript -e 'devtools::load_all(); cat("stimgate loaded successfully\n")'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false
