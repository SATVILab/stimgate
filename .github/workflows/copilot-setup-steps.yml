name: "Copilot Setup Steps"

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 0. Set up the environment
      - name: Install system dependencies setup-r does not
        run: |
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y \
            libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev \
            libgit2-dev libjpeg-dev libpng-dev libx11-dev pandoc

      # 1. Get the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up R
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # Deliberately do not run setup-r-dependencies or renv::restore() here.
      # Copilot setup should not try to install the full package dependency set.

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false
