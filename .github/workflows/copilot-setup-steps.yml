name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - DESCRIPTION
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 0. Set up the environment
      - name: Install system dependencies setup-r does not
        run: |
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y \
            libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev \
            libgit2-dev libjpeg-dev libpng-dev libx11-dev pandoc

      # 1. Get the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up R
      - uses: r-lib/actions/setup-r@v2
        with:
          # Pin the R minor release so cache keys remain stable across patch releases
          # and do not unexpectedly roll over when a new major/minor R release appears.
          r-version: '4.6'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::devtools
          needs: check
          # Save the package cache even if a later setup step fails. Runs on master
          # warm a cache that Copilot task branches can subsequently restore.
          cache: always

      - name: Verify R development environment
        run: |
          Rscript -e 'stopifnot(requireNamespace("devtools", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("testthat", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("flowCore", quietly = TRUE))'
          Rscript -e 'stopifnot(requireNamespace("flowWorkspace", quietly = TRUE))'
          Rscript -e 'devtools::load_all(); cat("stimgate loaded successfully\n")'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false
