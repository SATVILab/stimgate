name: Sync github-project-admin skill

on:
  push:
    branches:
      - sync-project-organisation-guidance

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-project-organisation-guidance
          fetch-depth: 0
      - name: Sync canonical skill
        shell: bash
        run: |
          git clone --depth 1 https://github.com/MiguelRodo/projects.git /tmp/projects-source
          rm -rf .agents/skills/github-project-admin
          mkdir -p .agents/skills
          cp -R /tmp/projects-source/skills/github-project-admin .agents/skills/github-project-admin
          rm -f .github/workflows/sync-project-admin.yml
          bash .agents/skills/github-project-admin/tests/run.sh
      - name: Commit synced skill
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills/github-project-admin .github/workflows/sync-project-admin.yml
          git commit -m "Update github-project-admin skill"
          git push origin HEAD:sync-project-organisation-guidance
