name: analysis-integration

on:
  push:
    branches: [master]
    paths:
      - '_projr.yml'
      - 'analysis/**'
      - 'scripts/r/**'
      - 'scripts/slurm/**'
      - 'R/**'
      - 'src/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '_projr.yml'
      - 'analysis/**'
      - 'scripts/r/**'
      - 'scripts/slurm/**'
      - 'R/**'
      - 'src/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/**'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis-integration:
    # Windows installs CRAN and Bioconductor binaries, so it is much faster
    # than Ubuntu, which builds the flowWorkspace stack from source.
    runs-on: windows-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Slurm analysis selection
        shell: bash
        run: bash analysis/tests/test-slurm-launchers.sh

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # The F-beta comparator (scripts/python/fbeta.py) runs through reticulate
      # and only needs numpy to compute thresholds.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install numpy

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          # Deliberately unpinned: analysis validation follows the current
          # SATVILab/projr and SATVILab/simcyto default branches used in development.
          # decor is needed by devtools::load_all() to register cpp11 code.
          extra-packages: any::devtools, any::testthat, any::decor, any::reticulate, any::future, any::furrr, any::progressr, any::withr, SATVILab/projr, SATVILab/simcyto, github::RGLab/cytoUtils, bioc::openCyto, bioc::flowStats
          needs: check
          # Save the package library even when the tests fail, so later runs
          # restore it instead of rebuilding every dependency from source.
          cache: always

      - name: Run analysis integration tests
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: Rscript analysis/tests/run_analysis_tests.R
