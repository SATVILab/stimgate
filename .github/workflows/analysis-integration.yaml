name: analysis-integration

on:
  push:
    branches: [master]
    paths:
      - 'analysis/**'
      - 'scripts/r/**'
      - 'R/**'
      - 'src/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'analysis/**'
      - 'scripts/r/**'
      - 'R/**'
      - 'src/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/**'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis-integration:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y \
            libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev \
            libgit2-dev libjpeg-dev libpng-dev libx11-dev pandoc

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat, SATVILab/simcyto@e9bba258c8629a7ab5fe0bb4b47bef0637a76111
          needs: check

      - name: Run analysis integration tests
        run: Rscript analysis/tests/run_analysis_tests.R
