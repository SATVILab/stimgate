name: analysis-integration

on:
  push:
    branches: [master]
    paths:
      - 'analysis/**'
      - 'scripts/r/**'
      - 'R/**'
      - 'src/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'analysis/**'
      - 'scripts/r/**'
      - 'R/**'
      - 'src/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/**'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis-integration:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install --no-install-recommends -y \
            libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev \
            libgit2-dev libjpeg-dev libpng-dev libx11-dev pandoc

      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          # Deliberately unpinned: analysis validation follows the current
          # SATVILab/simcyto default branch used by StimGate development.
          extra-packages: any::devtools, any::testthat, SATVILab/simcyto
          needs: check

      - name: Run analysis integration tests
        run: Rscript analysis/tests/run_analysis_tests.R
