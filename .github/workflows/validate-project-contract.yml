name: Validate Project contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".projects/**"
      - "AGENTS.md"
      - "scripts/codex-projects-setup.sh"
      - ".github/workflows/validate-project-contract.yml"
  push:
    branches: [master]
    paths:
      - ".projects/**"
      - "AGENTS.md"
      - ".github/workflows/validate-project-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out canonical Project skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MiguelRodo/github-projects-skill
          ref: v0.4.0
          path: .github-projects-source

      - name: Validate local Project contract
        run: |
          bash .github-projects-source/skills/github-projects/scripts/validate-contract.sh .

      - name: Verify repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/codex-projects-setup.sh
          section_lines="$(awk '
            /^### GitHub Project administration$/ { in_section = 1 }
            in_section { count += 1 }
            in_section && /^---$/ { print count; exit }
          ' AGENTS.md)"
          test "$section_lines" -lt 12
          if grep -Eq '^## (Priority mapping|Priority values|Class values|Class vocabulary|Status mapping)[[:space:]]*$' .projects/project.md; then
            echo "ERROR: the repository contract repeats shared Project semantics owned by github-projects" >&2
            exit 1
          fi
          if grep -Eq '^\| P[0-3] \|' .projects/project.md; then
            echo "ERROR: the repository contract redeclares the shared Priority mapping" >&2
            exit 1
          fi
